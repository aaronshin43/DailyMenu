name: Daily Menu Notification

on:
  # Supabase Cron calls workflow_dispatch at 07:00 America/New_York.
  # GitHub's schedule event was delayed by hours; do not restore it in parallel.
  workflow_dispatch:
    inputs:
      menu_date:
        description: 'Menu date (YYYY-MM-DD); blank uses the current New York date'
        required: false
        type: string
      validation_only:
        description: 'Run offline checks without sending emails'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-menu-delivery
  cancel-in-progress: false

jobs:
  send-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Validate sender without sending emails
        if: ${{ inputs.validation_only }}
        run: python -m unittest discover -s tests -p 'test_delivery_*.py'

      - name: Run Send Menu Script
        if: ${{ !inputs.validation_only }}
        env:
          MENU_DATE: ${{ inputs.menu_date }}
          PYTHONUNBUFFERED: '1'
          SITE_URL: ${{ secrets.SITE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          if [ -n "$MENU_DATE" ]; then
            python send_menu.py --date "$MENU_DATE"
          else
            python send_menu.py
          fi
